{% extends 'base.html' %}

{% block content %}

<h2>Analysis History</h2>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <th>Resume</th>
    <th>Score</th>
    <th>Role</th>
</tr>

{% for row in resumes %}

<tr>

    <td>{{ row[0] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
